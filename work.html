    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="site-header" data-active-page="work.html"></div>

    <main class="work-page" aria-label="Work 페이지">
      <section class="work-gallery-section section">
        <div class="container">
          <div class="work-filter" role="tablist" aria-label="포트폴리오 필터">
            <button class="work-filter-btn active" type="button" data-filter="all" role="tab" aria-selected="true">All</button>
            <button class="work-filter-btn" type="button" data-filter="website" data-en="Website" data-ko="웹사이트" role="tab" aria-selected="false">Website</button>
            <button class="work-filter-btn" type="button" data-filter="detail-page" data-en="Detail" data-ko="상세페이지" role="tab" aria-selected="false">Detail</button>
            <button class="work-filter-btn" type="button" data-filter="social" data-en="Social" data-ko="SNS" role="tab" aria-selected="false">Social</button>
            <button class="work-filter-btn" type="button" data-filter="package" data-en="Package" data-ko="패키지" role="tab" aria-selected="false">Package</button>
            <button class="work-filter-btn" type="button" data-filter="card" data-en="Card" data-ko="명함" role="tab" aria-selected="false">Card</button>
            <button class="work-filter-btn" type="button" data-filter="banner" data-en="Banner" data-ko="배너" role="tab" aria-selected="false">Banner</button>
            <button class="work-filter-btn" type="button" data-filter="ppt" data-en="PPT" data-ko="PPT" role="tab" aria-selected="false">PPT</button>
            <button class="work-filter-btn" type="button" data-filter="editorial" data-en="Editorial" data-ko="책자" role="tab" aria-selected="false">Editorial</button>
            <button class="work-filter-btn" type="button" data-filter="print" data-en="Print" data-ko="홍보물" role="tab" aria-selected="false">Print</button>
          </div>

          <div class="work-gallery-grid" id="workGalleryGrid">
            <article class="work-gallery-card is-visible" data-category="website">
              <img src="https://picsum.photos/seed/work-website-01/960/720" alt="브랜드 홈페이지 리뉴얼" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">브랜드 홈페이지 리뉴얼</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="detail-page">
              <img src="https://picsum.photos/seed/work-detail-01/960/720" alt="화장품 상세페이지" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">화장품 상세페이지</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="social card">
              <img src="https://picsum.photos/seed/work-social-01/960/720" alt="SNS 카드뉴스" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">SNS 카드뉴스</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="package">
              <img src="https://picsum.photos/seed/work-package-01/960/720" alt="패키지 디자인" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">패키지 디자인</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="ppt">
              <img src="https://picsum.photos/seed/work-ppt-01/960/720" alt="기업 PPT" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">기업 PPT</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="print">
              <img src="https://picsum.photos/seed/work-print-01/960/720" alt="전단지 디자인" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">전단지 디자인</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="editorial">
              <img src="https://picsum.photos/seed/work-editorial-01/960/720" alt="브로슈어" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">브로슈어</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="website">
              <img src="https://picsum.photos/seed/work-website-02/960/720" alt="반응형 웹사이트 구축" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">반응형 웹사이트 구축</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="social banner">
              <img src="https://picsum.photos/seed/work-social-02/960/720" alt="콘텐츠 배너 시리즈" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">콘텐츠 배너 시리즈</h3>
            </article>
            <article class="work-gallery-card is-visible" data-category="editorial">
              <img src="https://picsum.photos/seed/work-editorial-02/960/720" alt="매거진 에디토리얼" loading="lazy" />
              <div class="work-card-overlay"></div>
              <h3 class="work-card-title">매거진 에디토리얼</h3>
            </article>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script>
      const filterButtons = document.querySelectorAll(".work-filter-btn");
      const galleryCards = document.querySelectorAll(".work-gallery-card");

      const setButtonLabel = (button, showKorean) => {
        const englishLabel = button.dataset.en || button.textContent.trim();
        const koreanLabel = button.dataset.ko;

        if (!koreanLabel) return;
        button.textContent = showKorean ? koreanLabel : englishLabel;
      };

      const hideTimers = new WeakMap();

      const setFilter = (filter) => {
        galleryCards.forEach((card) => {
          const categories = card.dataset.category.split(/\s+/);
          const matches = filter === "all" || categories.includes(filter);

          if (matches) {
            const timerId = hideTimers.get(card);
            if (timerId) {
              clearTimeout(timerId);
              hideTimers.delete(card);
            }
            card.style.display = "block";
            card.classList.remove("is-hidden");
            requestAnimationFrame(() => card.classList.add("is-visible"));
            return;
          }

          card.classList.remove("is-visible");
          card.classList.add("is-hidden");
          const timeoutId = setTimeout(() => {
            if (card.classList.contains("is-hidden")) {
              card.style.display = "none";
            }
          }, 320);
          hideTimers.set(card, timeoutId);
        });
      };

      filterButtons.forEach((button) => {
        if (button.dataset.filter !== "all") {
          setButtonLabel(button, false);

          button.addEventListener("mouseenter", () => setButtonLabel(button, true));
          button.addEventListener("mouseleave", () => setButtonLabel(button, false));
          button.addEventListener("focus", () => setButtonLabel(button, true));
          button.addEventListener("blur", () => setButtonLabel(button, false));
        }

        button.addEventListener("click", () => {
          filterButtons.forEach((item) => {
            item.classList.remove("active");
            item.setAttribute("aria-selected", "false");
          });

          button.classList.add("active");
          button.setAttribute("aria-selected", "true");
          setFilter(button.dataset.filter);
        });
      });
    </script>
  </body>
</html>
